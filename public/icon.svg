<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle border highlight -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4" />

  <!-- Inner Dark Badge -->
  <rect x="48" y="48" width="416" height="416" rx="96" fill="url(#innerGrad)" filter="url(#shadow)" />
  <rect x="52" y="52" width="408" height="408" rx="92" fill="none" stroke="rgba(239, 68, 68, 0.4)" stroke-width="3" />

  <!-- Pizza Slice / Tech Emblem -->
  <g transform="translate(256, 220) scale(1.15)">
    <!-- Pizza Crust & Body -->
    <path d="M 0,-100 L 95,65 A 115,115 0 0,1 -95,65 Z" fill="url(#goldGrad)" filter="url(#shadow)" stroke="#d97706" stroke-width="4" />
    <!-- Sauce / Cheese Pattern -->
    <path d="M 0,-80 L 78,55 A 95,95 0 0,1 -78,55 Z" fill="#ef4444" opacity="0.9" />
    <path d="M 0,-68 L 68,48 A 82,82 0 0,1 -68,48 Z" fill="#fbbf24" />

    <!-- Pepperonis -->
    <circle cx="0" cy="-15" r="14" fill="#b91c1c" stroke="#7f1d1d" stroke-width="2" />
    <circle cx="-28" cy="20" r="13" fill="#b91c1c" stroke="#7f1d1d" stroke-width="2" />
    <circle cx="28" cy="20" r="13" fill="#b91c1c" stroke="#7f1d1d" stroke-width="2" />

    <!-- Herbs / Basil -->
    <circle cx="-10" cy="5" r="4" fill="#16a34a" />
    <circle cx="12" cy="-40" r="4" fill="#16a34a" />
    <circle cx="20" cy="0" r="3.5" fill="#16a34a" />
  </g>

  <!-- Typography AL STUDIO GESTÃO -->
  <text x="256" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="38" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    AL STUDIO
  </text>
  <text x="256" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="20" fill="#f87171" text-anchor="middle" letter-spacing="4">
    GESTÃO PWA
  </text>
</svg>
